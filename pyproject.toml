[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-g2-cv"
version = "0.1.0"
requires-python = ">=3.14"
description = "Frozen ORB with training-only group-CV molecular energy calibration"
dependencies = ["numpy==2.5.4", "ase==3.29.0"]

[tool.setuptools.packages.find]
include = ["orb_g2_cv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
orb_g2_cv = ["model.json"]

[project.optional-dependencies]
train = ["scikit-learn==1.9.1", "scipy==1.18.1"]
runtime = ["orb-models==0.5.4", "torch==2.14.1", "cached-path==1.8.0"]

[tool.uv]
override-dependencies = ["dm-tree==0.1.10", "filelock==4.2.10"]
